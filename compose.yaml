services:

  wordpress:
    image: wordpress:latest
    restart: always

    depends_on:
      - db

    ports:
      - "${WORDPRESS_PORT}:80"

    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - ./wordpress:/var/www/html


  db:
    image: mysql:8.4
    restart: always

    ports:
      - "${MYSQL_PORT}:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      # First database created automatically by MySQL
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME}

      # Application user
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - db:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
  
  api:
    build:
      context: ./api

    restart: always

    depends_on:
      - db

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${API_DB_NAME}

    volumes:
      - ./api:/app

volumes:
  db: